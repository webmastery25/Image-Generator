<!DOCTYPE html>
<html>
<head>
  <title>AI Image Generator</title>
</head>
<body style="background:#0f172a;color:white;text-align:center;padding:50px">

  <h1>AI Image Generator</h1>

  <input id="prompt" placeholder="Enter prompt" style="padding:10px;width:300px" />
  <br><br>

  <button onclick="generateImage()" style="padding:10px 20px">Generate</button>

  <br><br>

  <img id="result" width="400"/>

  <script>
    async function generateImage() {
      const prompt = document.getElementById("prompt").value

      if (!prompt) {
        alert("Enter prompt")
        return
      }

      try {
        const res = await fetch("/api/generate", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({ prompt })
        })

        const data = await res.json()

        if (!res.ok) {
          throw new Error(data.error || "Failed")
        }

        document.getElementById("result").src = data.imageUrl

      } catch (err) {
        console.error(err)
        alert("Error: " + err.message)
      }
    }
  </script>

</body>
</html>
